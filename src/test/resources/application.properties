# 測試不連真的 Bancho
osu.irc.auto-start=false
osu.irc.username=test-user
osu.irc.password=test-password
# 測試不啟動互動 shell（會讀 stdin）；shell runner 由 TestShellRunnerConfiguration 換成空的
spring.shell.interactive.enabled=false
# 與 main 的 application.properties 同名，會遮蔽它，所以要重複關閉 metrics 匯出
management.otlp.metrics.export.enabled=false
# 與正式的 bancho 在 OTel 中區隔（測試帶 otel profile 時也會送資料到 collector）
spring.application.name=bancho-test
# 測試不寫指令歷史檔
spring.shell.history.enabled=false
