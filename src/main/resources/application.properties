spring.application.name=bancho
osu.irc.host=${OSU_IRC_HOST:cho.ppy.sh}
osu.irc.port=${OSU_IRC_PORT:6667}
osu.irc.username=${OSU_IRC_USERNAME:}
osu.irc.password=${OSU_IRC_PASSWORD}
# 所有工作都在 virtual thread（daemon）上，沒有這個設定 JVM 啟動完就會直接結束
spring.main.keep-alive=true
# 預設不匯出 metrics；用 --spring.profiles.active=otel 開啟（見 application-otel.properties）
management.otlp.metrics.export.enabled=false
