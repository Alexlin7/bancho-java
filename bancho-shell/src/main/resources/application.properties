spring.application.name=bancho-shell
osu.irc.host=${OSU_IRC_HOST:cho.ppy.sh}
osu.irc.port=${OSU_IRC_PORT:6667}
osu.irc.username=${OSU_IRC_USERNAME:}
osu.irc.password=${OSU_IRC_PASSWORD:}
# 沒有設定帳密時照常啟動，由使用者在 shell 中執行 login
osu.irc.deferred-login=true
# 互動 shell 本身會佔住 main thread；設成 true 時 quit 後 JVM 不會結束。
# 日後若有不開 shell 的執行方式（例如只跑 Discord），要改回 true，否則 JVM 啟動完就會結束。
spring.main.keep-alive=false
# 互動 shell 的終端機只顯示 WARN 以上，INFO 照樣寫檔。
logging.threshold.console=WARN
# 完整 log（INFO 以上）；相對路徑以啟動時的工作目錄為準。
logging.file.name=${BANCHO_LOG_FILE:logs/bancho.log}
# Spring Shell 預設把指令歷史存在 ${spring.application.name}.log（工作目錄下），容易和 logs/bancho.log 混淆。
spring.shell.history.name=bancho-history
# 把 BanchoBot 與 Bancho 系統訊息寫到 log 資料夾的 samples-<日期>.irc（測試者回傳用來補樣本）；密碼已遮蔽、不含玩家聊天
bancho.samples.enabled=true
